name: Test

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install NSS
        uses: mozilla/nss-rs/install-nss@v0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Rust code
        run: cargo build

      - name: Test Rust code
        run: cargo test
